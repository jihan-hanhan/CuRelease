<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuRelease</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="AppHeader">
      <div class="AppHeader-inner container">
        <div class="AppHeader-brand">
          <svg
            class="AppHeader-logo"
            viewBox="0 0 16 16"
            width="28"
            height="28"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
            />
          </svg>
          <span class="AppHeader-title" id="page-title">CuRelease</span>
        </div>

        <div class="AppHeader-actions">
          <div class="mirror-select">
            <label for="mirror">镜像：</label>
            <select id="mirror" title="选择下载镜像线路"></select>
          </div>
          <button
            class="btn btn-icon"
            id="theme-toggle"
            title="切换主题"
            aria-label="切换主题"
          >
            <svg class="theme-icon theme-icon-light" viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0Zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13ZM.75 8a.75.75 0 0 1-.75-.75.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5H.75Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 13.75 8ZM2.343 2.343a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 0 1-1.06 1.06L2.343 3.403a.75.75 0 0 1 0-1.06Zm9.193 9.193a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 1 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06Zm0-9.193a.75.75 0 0 1 0 1.06l-1.06 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0ZM3.403 11.537a.75.75 0 0 1 0 1.06l-1.06 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0Z"/></svg>
            <svg class="theme-icon theme-icon-dark" viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278Z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="repo-header">
        <h1 class="repo-title" id="repo-title">
          <span id="repo-owner">—</span> / <span id="repo-name">—</span>
        </h1>
        <p class="repo-desc" id="repo-desc"></p>
        <div class="repo-meta">
          <a
            class="Link"
            id="repo-link"
            href="#"
            target="_blank"
            rel="noopener"
            >在 GitHub 上查看</a
          >
          <span class="repo-meta-sep">·</span>
          <span id="last-updated">—</span>
        </div>
      </section>

      <div id="status" class="status">加载中…</div>
      <div id="releases" class="releases"></div>
    </main>

    <footer class="AppFooter">
      <div class="container">
        <span>Powered by <a class="Link" href="https://github.com/" target="_blank" rel="noopener">CuRelease</a></span>
      </div>
    </footer>

    <script src="vendor/marked.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
